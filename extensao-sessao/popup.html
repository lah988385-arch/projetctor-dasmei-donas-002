<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
    body { width: 340px; margin: 0; background: #0f172a; color: #e2e8f0; }
    .top { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #1e293b; }
    .top .dot { width: 28px; height: 28px; border-radius: 8px; background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.35); display: flex; align-items: center; justify-content: center; color: #34d399; font-weight: 700; }
    .top h1 { font-size: 14px; margin: 0; }
    .top p { font-size: 11px; margin: 0; color: #94a3b8; }
    .body { padding: 14px 16px; }
    label { display: block; font-size: 11px; color: #94a3b8; margin: 10px 0 4px; }
    input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; color: #fff; font-size: 13px; }
    input:focus { outline: none; border-color: #10b981; }
    button { width: 100%; margin-top: 12px; background: #10b981; color: #052e23; border: none; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    button.sec { background: #1e293b; color: #cbd5e1; margin-top: 8px; }
    button:disabled { opacity: .6; cursor: default; }
    #log { margin-top: 12px; font-size: 11px; line-height: 1.5; max-height: 170px; overflow-y: auto; white-space: pre-wrap; background: #0b1220; border: 1px solid #1e293b; border-radius: 8px; padding: 8px 10px; color: #cbd5e1; }
    .ok { color: #34d399; } .err { color: #f87171; }
    .hint { font-size: 10px; color: #64748b; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="top">
    <div class="dot">D</div>
    <div>
      <h1>Importar PGMEI</h1>
      <p>Lê os valores reais do CNPJ aberto</p>
    </div>
  </div>
  <div class="body">
    <label>Endereço do painel</label>
    <input id="painel" placeholder="https://seu-painel.com" />
    <button id="importar">Importar CNPJ aberto (todos os anos)</button>
    <button id="parar" class="sec">Parar</button>
    <div id="log"></div>
    <p class="hint">Faça login no gov.br, abra "Emitir Guia de Pagamento (DAS)" de um CNPJ (a tabela de meses precisa estar na tela) e clique em Importar. A extensão varre os anos sozinha.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
